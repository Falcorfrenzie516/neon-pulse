<!--
    NEON PULSE
    Generator Component
    Alpha 1.9.x

    Loaded by index.html.
    Generator behavior/state remains controlled by game.js.
-->

<section id="generator-system" class="generator-system" hidden>

    <!--
        GENERATOR TEMPLATE

        game.js clones this template whenever a generator
        needs to be spawned into a Backstage row.
    -->
    <template id="generator-template">

        <div class="power-generator"
             data-generator-level="1"
             data-generator-health="0"
             data-generator-max-health="0">

            <div class="generator-visual">

                <img
                    class="generator-image"
                    src=""
                    alt="Power Generator"
                    draggable="false"
                >

                <div class="generator-health">
                    <div class="generator-health-fill"></div>
                </div>

            </div>

        </div>

    </template>


    <!--
        GENERATOR LEVEL DATA

        Image paths assume generator images are stored
        inside /assets/.
    -->
    <div id="generator-assets" hidden>

        <span data-level="1"
              data-image="assets/generator-1.png"></span>

        <span data-level="2"
              data-image="assets/generator-2.png"></span>

        <span data-level="3"
              data-image="assets/generator-3.png"></span>

        <span data-level="4"
              data-image="assets/generator-4.png"></span>

        <span data-level="5"
              data-image="assets/generator-5.png"></span>

        <span data-level="6"
              data-image="assets/generator-6.png"></span>

        <span data-level="7"
              data-image="assets/generator-7.png"></span>

        <span data-level="8"
              data-image="assets/generator-8.png"></span>

        <span data-level="9"
              data-image="assets/generator-9.png"></span>

        <span data-level="10"
              data-image="assets/generator-10.png"></span>

    </div>


    <!--
        ROW POWER DISTRIBUTION REFERENCE

        Rows 1–2
        Level 1 = 60%
        Level 2 = 20%
        Level 3 = 15%
        Level 4 = 5%

        Rows 3–4
        Level 4 = 60%
        Level 3 = 20%
        Level 5 = 15%
        Level 6 = 5%

        Rows 5–6
        Level 5 = 60%
        Level 6 = 20%
        Level 7 = 15%
        Level 8 = 5%

        Rows 7–8
        Level 7 = 60%
        Level 8 = 20%
        Level 10 = 15%
        Level 9 = 5%
    -->

</section>
